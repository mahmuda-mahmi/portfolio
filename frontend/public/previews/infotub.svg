<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="16" fill="#F9F8F6"/>
  <!-- Browser Chrome -->
  <rect width="1200" height="44" rx="16" fill="#EBEAE6"/>
  <rect y="28" width="1200" height="16" fill="#EBEAE6"/>
  <circle cx="28" cy="22" r="6" fill="#D4D2CC"/>
  <circle cx="48" cy="22" r="6" fill="#D4D2CC"/>
  <circle cx="68" cy="22" r="6" fill="#D4D2CC"/>
  <rect x="420" y="10" width="360" height="24" rx="6" fill="#F9F8F6"/>
  <text x="600" y="26" text-anchor="middle" fill="#6D6D6D" font-family="monospace" font-size="12">infotub.app // knowledge hub</text>
  <!-- Top Nav -->
  <text x="48" y="92" fill="#181818" font-family="monospace" font-weight="700" font-size="22">INFOTUB</text>
  <text x="840" y="90" fill="#555" font-family="sans-serif" font-size="14">Articles</text>
  <text x="920" y="90" fill="#555" font-family="sans-serif" font-size="14">Topics</text>
  <text x="995" y="90" fill="#555" font-family="sans-serif" font-size="14">Docs</text>
  <rect x="1060" y="70" width="92" height="32" rx="6" fill="#181818"/>
  <text x="1106" y="91" text-anchor="middle" fill="#F9F8F6" font-family="monospace" font-size="12">PUBLISH</text>
  <line x1="48" y1="118" x2="1152" y2="118" stroke="#E0DFDA"/>
  <!-- Hero -->
  <text x="48" y="182" fill="#181818" font-family="Georgia, serif" font-size="44">Structured knowledge &amp;</text>
  <text x="48" y="232" fill="#181818" font-family="Georgia, serif" font-size="44">editorial guides for builders.</text>
  <text x="48" y="270" fill="#6D6D6D" font-family="sans-serif" font-size="16">Built with Laravel, Blade, and MySQL — clean relational schemas &amp; fast server-rendered workflows.</text>
  <!-- Cards -->
  <rect x="48" y="316" width="350" height="350" rx="12" fill="#FFFFFF" stroke="#E2E1DC"/>
  <rect x="68" y="336" width="310" height="170" rx="8" fill="#212121"/>
  <text x="223" y="428" text-anchor="middle" fill="#BFA8F5" font-family="monospace" font-size="18">LARAVEL + MYSQL</text>
  <text x="68" y="540" fill="#181818" font-family="sans-serif" font-weight="700" font-size="18">Relational Schema Design</text>
  <text x="68" y="568" fill="#6D6D6D" font-family="sans-serif" font-size="13">Normalized tables, indexed lookups, and</text>
  <text x="68" y="588" fill="#6D6D6D" font-family="sans-serif" font-size="13">clean Eloquent query scopes.</text>
  <rect x="68" y="616" width="90" height="26" rx="5" fill="#EBEAE6"/>
  <text x="113" y="633" text-anchor="middle" fill="#181818" font-family="monospace" font-size="11">BACKEND</text>

  <rect x="425" y="316" width="350" height="350" rx="12" fill="#FFFFFF" stroke="#E2E1DC"/>
  <rect x="445" y="336" width="310" height="170" rx="8" fill="#E8E0FA"/>
  <text x="600" y="428" text-anchor="middle" fill="#181818" font-family="monospace" font-size="18">BLADE UI SYSTEM</text>
  <text x="445" y="540" fill="#181818" font-family="sans-serif" font-weight="700" font-size="18">Modular Blade Components</text>
  <text x="445" y="568" fill="#6D6D6D" font-family="sans-serif" font-size="13">Reusable layout slots, form validation,</text>
  <text x="445" y="588" fill="#6D6D6D" font-family="sans-serif" font-size="13">and fast server-rendered views.</text>
  <rect x="445" y="616" width="90" height="26" rx="5" fill="#EBEAE6"/>
  <text x="490" y="633" text-anchor="middle" fill="#181818" font-family="monospace" font-size="11">FRONTEND</text>

  <rect x="802" y="316" width="350" height="350" rx="12" fill="#FFFFFF" stroke="#E2E1DC"/>
  <rect x="822" y="336" width="310" height="170" rx="8" fill="#DFDFDA"/>
  <text x="977" y="428" text-anchor="middle" fill="#181818" font-family="monospace" font-size="18">ROLE-BASED AUTH</text>
  <text x="822" y="540" fill="#181818" font-family="sans-serif" font-weight="700" font-size="18">Policy-Driven Access</text>
  <text x="822" y="568" fill="#6D6D6D" font-family="sans-serif" font-size="13">Protected authoring routes, CSRF guards,</text>
  <text x="822" y="588" fill="#6D6D6D" font-family="sans-serif" font-size="13">and audit-ready CRUD pipelines.</text>
  <rect x="822" y="616" width="90" height="26" rx="5" fill="#EBEAE6"/>
  <text x="867" y="633" text-anchor="middle" fill="#181818" font-family="monospace" font-size="11">SECURITY</text>
</svg>
